<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="Description" content="Online multiplayer game inspired by the Dune board game" />

    <title>treachery.online</title>

    <base href="/" />

    <link rel="stylesheet" href="css/app.css?v=227" />

    <link rel="stylesheet" href="Treachery.Client.styles.css?v=189">

    <script type="text/javascript">

        const LoggingEnabled = false;

        function GetLocalStorageKeys() {

            let result = [];
            for (let i = 0; i < localStorage.length; i++)
            {
                result.push(localStorage.key(i));
            }

            return result;
        }

        function MeasureText(text, font) {

            // re-use canvas object for better performance
            const canvas = MeasureText.canvas || (MeasureText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");

            context.font = font;
            const metrics = context.measureText(text);

            if ("fontBoundingBoxAscent" in metrics) {

                return {
                    Width: metrics.width,
                    Height: metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent,
                };
            }
            else {

                return {
                    Width: metrics.width,
                    Height: 1.4 * (metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent),
                };
            }
        }

        function SetPlanetMapScale() {

            const frame = document.getElementById('mapdiv');
            const board = document.getElementById('planetmap');
            const content = document.getElementById('planetmap_inner');
            if (!frame || !board || !content) return;

            if (!mapResizeObserver) {
                mapResizeObserver = new ResizeObserver(SetPlanetMapScale);
            }
            mapResizeObserver.observe(frame);

            const centerX = Number(content.dataset.mapCenterX);
            const centerY = Number(content.dataset.mapCenterY);
            const mapRadius = Number(content.dataset.mapRadius);
            const playerTokenRadius = Number(content.dataset.playerTokenRadius);
            if (![centerX, centerY, mapRadius, playerTokenRadius].every(Number.isFinite)) return;

            const visualRadius = 1.06 * mapRadius + 1.5 * playerTokenRadius;
            const reserveRight = parseFloat(getComputedStyle(frame).getPropertyValue('--map-reserve-right')) || 0;
            const availableWidth = Math.max(0, frame.clientWidth - 16 - reserveRight);
            const availableHeight = Math.max(0, frame.clientHeight - 16);
            const diameter = 2 * visualRadius;
            const scale = Math.min(availableWidth / diameter, availableHeight / diameter);
            if (!Number.isFinite(scale) || scale <= 0) return;

            board.style.width = `${content.offsetWidth}px`;
            board.style.height = `${content.offsetHeight}px`;
            board.style.left = `calc(50% - ${reserveRight / 2}px)`;
            board.style.top = '50%';
            board.style.transformOrigin = '0 0';
            board.style.transform = `translate(${-centerX * scale}px, ${-centerY * scale}px) scale(${scale})`;
        }

        let mapResizeObserver = null;

        function GetWindowDimensions() {

            try {

                determinedWidth = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
                determinedHeight = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
            }
            catch (error) {

                determinedWidth = 800;
                determinedHeight = 600;
            }

            return { Width: determinedWidth, Height: determinedHeight };
        }

        function RemoveFocusFromButtons() {

            document.querySelectorAll("button").forEach(item => item.blur());
        }

        const gamePopoverSelector = '[data-game-popover]';
        let activeGamePopover = null;
        let activeGamePopoverTrigger = null;
        let gamePopoverHideTimer = 0;

        function HideGamePopover() {
            if (activeGamePopover) {
                activeGamePopover.remove();
                activeGamePopover = null;
                activeGamePopoverTrigger = null;
            }
        }

        function PlaceGamePopover(popover, trigger) {
            const bounds = trigger.getBoundingClientRect();
            const popupBounds = popover.getBoundingClientRect();
            const left = Math.min(window.innerWidth - popupBounds.width - 12, Math.max(12, bounds.left + (bounds.width - popupBounds.width) / 2));
            const top = bounds.top > popupBounds.height + 12 ? bounds.top - popupBounds.height - 10 : Math.max(12, Math.min(window.innerHeight - popupBounds.height - 12, bounds.bottom + 10));
            popover.style.left = `${left}px`;
            popover.style.top = `${top}px`;
        }

        function SetGamePopoverContent(popover, trigger, content) {
            popover.gameContent = content;
            popover.innerHTML = content;
            popover.classList.toggle('is-media', !popover.textContent.trim());
            // Images are measured before they load; re-place once they have their real size.
            popover.querySelectorAll('img').forEach(img => {
                if (!img.complete) img.addEventListener('load', () => { if (activeGamePopover === popover) PlaceGamePopover(popover, trigger); }, { once: true });
            });
        }

        function ShowGamePopover(trigger) {
            if (!trigger || !trigger.dataset.gamePopover) return;
            window.clearTimeout(gamePopoverHideTimer);

            const content = trigger.dataset.gamePopover;

            // Re-renders (e.g. every heartbeat) and pointer moves within the trigger must not re-create the open popover:
            // that would replay its entry animation and reload its images, which shows as blinking.
            if (activeGamePopover && activeGamePopoverTrigger === trigger && activeGamePopover.isConnected) {
                if (activeGamePopover.gameContent !== content) {
                    SetGamePopoverContent(activeGamePopover, trigger, content);
                    PlaceGamePopover(activeGamePopover, trigger);
                }
                return;
            }

            HideGamePopover();

            // Inside a modal dialog or floating window (top layer) the popover must live in it to appear above it.
            const host = trigger.closest('dialog[open], [popover]') || document.body;
            const popover = document.createElement('div');
            popover.className = 'game-popover';
            popover.setAttribute('role', 'tooltip');
            SetGamePopoverContent(popover, trigger, content);
            host.appendChild(popover);
            PlaceGamePopover(popover, trigger);
            activeGamePopover = popover;
            activeGamePopoverTrigger = trigger;
        }

        document.addEventListener('pointerover', event => {
            if (!(event.target instanceof Element)) return;
            const trigger = event.target.closest(gamePopoverSelector);
            if (trigger) ShowGamePopover(trigger);
        });

        document.addEventListener('pointerout', event => {
            if (!(event.target instanceof Element)) return;
            if (event.target.closest(gamePopoverSelector)) {
                gamePopoverHideTimer = window.setTimeout(HideGamePopover, 120);
            }
        });

        document.addEventListener('focusin', event => {
            if (!(event.target instanceof Element)) return;
            const trigger = event.target.closest(gamePopoverSelector);
            if (trigger) ShowGamePopover(trigger);
        });

        document.addEventListener('focusout', event => {
            if (!(event.target instanceof Element)) return;
            if (event.target.closest(gamePopoverSelector)) HideGamePopover();
        });

        function EnablePopover(element) {
            if (element && element.matches(gamePopoverSelector)) element.setAttribute('tabindex', '0');
        }
                
        function EnablePopovers(element) {

            if (element == null) return;
            
            element.querySelectorAll(gamePopoverSelector).forEach(EnablePopover);
        }

        function RemovePopover(element) {

            if (element == null) return;
            
            if (activeGamePopover && element && activeGamePopoverTrigger === element) HideGamePopover();
        }

        function RemovePopovers(element) {

            if (element == null) return;
            
            element.querySelectorAll(gamePopoverSelector).forEach(RemovePopover);
        }

        function RefreshPopover(element) {

            if (element == null) return;
            
            if (element.matches(gamePopoverSelector)) {
                EnablePopover(element);
                if (activeGamePopoverTrigger === element) ShowGamePopover(element);
            }
        }

        function RefreshPopovers(element) {
            
            if (element == null) return;
            
            element.querySelectorAll(gamePopoverSelector).forEach(RefreshPopover);
        }

        /*
         * Sounds
         */

        let currentSounds = new Map();
        function isExpectedMediaFetchAbort(error) {
            const message = error && error.message || String(error);
            return /fetching process for the media resource was aborted by the user agent at the user[â€™']s request/i.test(message);
        }

        function isExpectedPlaybackInterruption(error) {
            const errorName = error && error.name;
            return errorName === "NotAllowedError"
                || errorName === "AbortError"
                || isExpectedMediaFetchAbort(error);
        }

        // Safari never reloads an audio element after a failed fetch (e.g. while the tab was suspended);
        // such an element keeps rejecting play() with MediaError code 4, so it must be replaced.
        function hasMediaError(sound) {
            return sound.error != null;
        }

        function playSound(sound, onMediaError) {
            const playbackCallStack = new Error().stack || "Unavailable";
            const enrichError = error => {
                const errorName = error && error.name;
                const errorMessage = error && error.message || String(error);
                const mediaError = sound.error;
                const source = sound.currentSrc || sound.src || "(unknown)";
                const mediaState = mediaError
                    ? `Media error code: ${mediaError.code}; ${mediaError.message || ""}`
                    : `Media state: networkState=${sound.networkState}, readyState=${sound.readyState}`;
                const enriched = new Error(
                    `${errorMessage}\nAudio source: ${source}\n${mediaState}\nPlayback requested at:\n${playbackCallStack}`);
                enriched.name = errorName || "Error";
                return enriched;
            };
            const handleError = error => {
                if (isExpectedPlaybackInterruption(error)) return;
                if (hasMediaError(sound) && onMediaError && onMediaError()) return;
                throw enrichError(error);
            };
            let playPromise;
            try {
                playPromise = sound.play();
            } catch (error) {
                handleError(error);
                return;
            }

            if (playPromise) {
                playPromise.catch(handleError);
            }
        }

        function PlaySound(file, fadeTime, volume, loop, isRetry) {

            let sound = currentSounds.get(file);
            if (sound != null && hasMediaError(sound)) {
                sound.pause();
                currentSounds.delete(file);
                sound = null;
            }

            const retryWithFreshElement = () => {
                if (currentSounds.get(file) === sound) currentSounds.delete(file);
                if (isRetry) return false;
                PlaySound(file, fadeTime, volume, loop, true);
                return true;
            };

            if (sound != null)
            {
                sound.currentTime = 0;
                playSound(sound, retryWithFreshElement);
            }
            else
            {
                sound = new Audio(file);
                sound.loop = loop;

                currentSounds.set(file, sound);

                if (fadeTime > 0) {
                    fadeStepTimeInterval = fadeTime / 8;
                    fadeStepVolumeInterval = volume / 8;
                    var interval = setInterval(function () {
                        if (sound.volume + fadeStepVolumeInterval >= volume) {
                            clearInterval(interval);
                            sound.volume = volume;
                        }
                        else {
                            sound.volume += fadeStepVolumeInterval;
                        }
                    }, fadeStepTimeInterval)
                }
                else {

                    sound.volume = volume;
                }

                playSound(sound, retryWithFreshElement);
            }
        }

        function StopSound(file, fadeTime) {

            let sound = currentSounds.get(file);         

            if (sound != null)
            {
                if (fadeTime > 0)
                {
                    fadeStepTimeInterval = fadeTime / 8;
                    fadeStepVolumeInterval = sound.volume / 8;
                    var interval = setInterval(function ()
                    {
                        if (sound.volume <= fadeStepVolumeInterval)
                        {
                            clearInterval(interval);
                            sound.pause();
                            currentSounds.delete(file);
                        }
                        else
                        {
                            sound.volume -= fadeStepVolumeInterval;
                        }
                    }, fadeStepTimeInterval)
                }
                else
                {
                    sound.pause();
                    currentSounds.delete(file);
                }

            }
        }

        function StopSounds(fadeTime) {

            currentSounds.forEach((values, key) => {
                StopSound(key, fadeTime);
            })
        }

        function ChangeSoundVolume(file, volume) {

            let sound = currentSounds.get(file);

            if (sound != null) {

                sound.volume = volume;
            }
        }

        /*
         * Read and write files locally
         */

        function saveFile(filename, data) {
            const blob = new Blob([data], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            let link = document.createElement('a');
            link.download = filename;
            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function readFile(inputFile) {

            const temporaryFileReader = new FileReader();
            return new Promise((resolve, reject) => {

                temporaryFileReader.onerror = () => {
                    temporaryFileReader.abort();
                    reject(new DOMException("Problem parsing input file."));
                };

                temporaryFileReader.addEventListener("load", function () {
                    resolve(temporaryFileReader.result);
                }, false);

                temporaryFileReader.readAsText(inputFile.files[0]);
            });
        }

        function Clear(id) {

            document.getElementById(id).value = "";
        }

        async function CopyToClipboard(text) {

            await navigator.clipboard.writeText(text);
            return true;
        }

        function UrlExists(url) {

            let img = new Image();

            return new Promise(

                (resolve) => {

                    img.onerror = () => {
                        resolve(false);
                    };

                    img.onload = () => {
                        resolve(true);
                    };

                    img.src = url;

                });
        }

        /*
         * Other support functions
         */

        function ClearSelection() {

            if (window.getSelection) { window.getSelection().removeAllRanges(); }
            else if (document.selection) { document.selection.empty(); }
        }

        function HideModal(modalId) {

            let element = document.getElementById(modalId);
            if (element instanceof HTMLDialogElement && element.open) element.close();
        }

        document.addEventListener('click', event => {
            if (!(event.target instanceof Element)) return;
            const menuOption = event.target.closest('.status-menu-options button');
            if (menuOption) menuOption.closest('details').open = false;

            const opener = event.target.closest('[data-dialog-target]');
            if (opener) {
                const target = opener.dataset.dialogTarget || '';
                const dialog = target.startsWith('#') ? document.getElementById(target.slice(1)) : document.querySelector(target);
                if (dialog instanceof HTMLDialogElement && !dialog.open) dialog.showModal();
                else if (dialog && dialog.hasAttribute('popover')) ShowFloatingWindow(dialog);
                return;
            }

            const closer = event.target.closest('[data-dialog-close]');
            if (closer) {
                const floating = closer.closest('[popover]');
                if (floating) HidePopoverWindow(floating);
                else closer.closest('dialog')?.close();
            }
        });

        // Browsers without the Popover API (e.g. Chrome < 114) toggle the is-popover-open class instead (see app.css).
        const popoverSupported = typeof HTMLElement !== 'undefined' && HTMLElement.prototype.hasOwnProperty('popover');
        if (!popoverSupported) document.documentElement.classList.add('no-popover-api');

        function IsPopoverOpen(win) {
            return popoverSupported ? win.matches(':popover-open') : win.classList.contains('is-popover-open');
        }

        function ShowPopoverWindow(win) {
            if (IsPopoverOpen(win)) return;
            if (popoverSupported) win.showPopover();
            else win.classList.add('is-popover-open');
        }

        function HidePopoverWindow(win) {
            if (!IsPopoverOpen(win)) return;
            if (popoverSupported) win.hidePopover();
            else win.classList.remove('is-popover-open');
        }

        // Non-blocking floating windows ([popover="manual"]): only one per draggable group is shown, at its last dragged position.
        function ShowFloatingWindow(win) {
            const group = win.dataset.draggable;
            if (group) document.querySelectorAll(`[popover][data-draggable="${CSS.escape(group)}"]`).forEach(other => {
                if (other !== win) HidePopoverWindow(other);
            });
            ShowPopoverWindow(win);
            if (group) RestoreDragPosition(win, group);
        }

        document.addEventListener('click', event => {
            if (event.target instanceof HTMLDialogElement && event.target.open) event.target.close();
        });

        function CloseMenuDropdowns(except) {
            document.querySelectorAll('.game-menu-toolbar .menu-dropdown-anchor > button[aria-expanded]:not([aria-expanded="false"])')
                .forEach(button => { if (!except || !except.contains(button)) button.click(); });
        }

        document.addEventListener('pointerdown', event => {
            if (!(event.target instanceof Element)) return;
            if (event.target.closest('dialog[open]')) return;
            CloseMenuDropdowns(event.target.closest('.game-menu-toolbar .menu-dropdown-anchor'));
        }, true);

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') CloseMenuDropdowns(null);
            if (event.key === 'Escape' && !document.querySelector('dialog[open]')) {
                document.querySelectorAll('[popover][data-draggable]').forEach(HidePopoverWindow);
            }
        });

        // Draggable floating panels: [data-draggable="key"] moved by its [data-drag-handle], kept inside its offset parent (or the viewport).
        const dragPositions = {};
        let activeDrag = null;

        function clampDrag(el, x, y) {
            const parent = el.offsetParent;
            if (!parent) {
                if (getComputedStyle(el).position !== 'fixed') return { x, y };
                const rect = el.getBoundingClientRect();
                const baseLeft = rect.left - (parseFloat(el.style.getPropertyValue('--drag-x')) || 0);
                const baseTop = rect.top - (parseFloat(el.style.getPropertyValue('--drag-y')) || 0);
                const minX = -baseLeft, maxX = window.innerWidth - rect.width - baseLeft;
                const minY = -baseTop, maxY = window.innerHeight - 48 - baseTop;
                return { x: Math.min(Math.max(x, minX), Math.max(minX, maxX)), y: Math.min(Math.max(y, minY), Math.max(minY, maxY)) };
            }
            const baseLeft = el.offsetLeft;
            const baseTop = el.offsetTop;
            const maxX = parent.clientWidth - el.offsetWidth - baseLeft, minX = -baseLeft;
            const maxY = parent.clientHeight - 48 - baseTop, minY = -baseTop;
            return { x: Math.min(Math.max(x, minX), Math.max(minX, maxX)), y: Math.min(Math.max(y, minY), Math.max(minY, maxY)) };
        }

        function applyDrag(el, x, y) {
            const p = clampDrag(el, x, y);
            el.style.setProperty('--drag-x', p.x + 'px');
            el.style.setProperty('--drag-y', p.y + 'px');
            return p;
        }

        function RestoreDragPosition(el, key) {
            const p = dragPositions[key];
            if (el && p) applyDrag(el, p.x, p.y);
        }

        document.addEventListener('pointerdown', event => {
            if (!(event.target instanceof Element)) return;
            const handle = event.target.closest('[data-drag-handle]');
            if (!handle || event.button > 0 || event.target.closest('button, a, input, select, textarea, .bw-picker, .bwl-forces, .number-picker-component')) return;
            const el = handle.closest('[data-draggable]');
            if (!el) return;
            activeDrag = {
                el, handle, id: event.pointerId, sx: event.clientX, sy: event.clientY,
                x: parseFloat(el.style.getPropertyValue('--drag-x')) || 0,
                y: parseFloat(el.style.getPropertyValue('--drag-y')) || 0
            };
            handle.setPointerCapture(event.pointerId);
            el.classList.add('is-dragging');
            event.preventDefault();
        });

        document.addEventListener('pointermove', event => {
            if (!activeDrag || event.pointerId !== activeDrag.id) return;
            const p = applyDrag(activeDrag.el, activeDrag.x + event.clientX - activeDrag.sx, activeDrag.y + event.clientY - activeDrag.sy);
            dragPositions[activeDrag.el.dataset.draggable] = p;
        });

        function endDrag(event) {
            if (!activeDrag || event.pointerId !== activeDrag.id) return;
            activeDrag.el.classList.remove('is-dragging');
            activeDrag = null;
        }

        // Usable treachery cards wiggle 3s after becoming highlighted, then each following wiggle comes 1s later than the previous gap.
        const cardWiggles = new Map();
        const cardWiggleFrames = [
            { transform: 'rotate(0deg)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(3.5deg)' },
            { transform: 'rotate(-2.5deg)' }, { transform: 'rotate(1.5deg)' }, { transform: 'rotate(0deg)' }
        ];
        setInterval(() => {
            const now = Date.now();
            const highlighted = new Set(document.querySelectorAll('.player-hand-card.is-card-use-available'));
            cardWiggles.forEach((_, el) => { if (!highlighted.has(el)) cardWiggles.delete(el); });
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            highlighted.forEach(el => {
                let state = cardWiggles.get(el);
                if (!state) {
                    cardWiggles.set(el, { gap: 3000, next: now + 3000 });
                    return;
                }
                if (now < state.next) return;
                const img = el.querySelector('img');
                if (img && !el.matches(':hover')) img.animate(cardWiggleFrames, { duration: 960, easing: 'ease-in-out' });
                state.gap += 1000;
                state.next = now + state.gap;
            });
        }, 200);

        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);

        function ToggleFullScreen() {

            let element = document.body;
            let isFullscreen = IsFullScreen();

            element.requestFullScreen = element.requestFullScreen || element.webkitRequestFullScreen || element.mozRequestFullScreen || function () { return false; };
            document.cancelFullScreen = document.cancelFullScreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || function () { return false; };

            isFullscreen ? document.cancelFullScreen() : element.requestFullScreen();
        }

        function IsFullScreen() {

            return document.fullscreenElement != null
        }

        function Print(elementId) {

            let elem = document.getElementById(elementId);
            let domClone = elem.cloneNode(true);
            let printSection = document.getElementById("printSection");

            if (!printSection) {

                printSection = document.createElement("div");
                printSection.id = "printSection";
                document.body.appendChild(printSection);
            }

            printSection.innerHTML = "";
            printSection.appendChild(domClone);
            window.print();
        }

        function Log(text) {

            if (LoggingEnabled) {

                console.log(text);
            }
        }

    </script>

</head>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred and was recorded.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">ðŸ—™</a>
    </div>

    <script type="text/javascript">
        window.addEventListener("resize", SetPlanetMapScale);

        window.treacheryErrorLogging = (() => {
            let dotNetReference;
            const report = (source, message, details, lineNumber, columnNumber) => {
                if (source === "JavaScript" && isExpectedMediaFetchAbort(message)) return;
                if (dotNetReference == null) return;
                dotNetReference.invokeMethodAsync(
                    "ReportClientError",
                    source,
                    String(message || "Unknown client error"),
                    String(details || ""),
                    window.location.pathname + window.location.hash,
                    navigator.userAgent,
                    lineNumber || null,
                    columnNumber || null
                ).catch(error => console.warn("Unable to report client error to treachery.online", error));
            };
            const onError = event => {
                report(
                    "JavaScript",
                    event.message || "JavaScript resource failed to load",
                    event.error && event.error.stack || "",
                    event.lineno,
                    event.colno
                );
            };
            const onUnhandledRejection = event => {
                const reason = event.reason;
                report(
                    "JavaScript",
                    reason && reason.message || String(reason || "Unhandled promise rejection"),
                    reason && reason.stack || ""
                );
            };

            return {
                start: reference => {
                    dotNetReference = reference;
                    window.addEventListener("error", onError);
                    window.addEventListener("unhandledrejection", onUnhandledRejection);
                },
                stop: () => {
                    window.removeEventListener("error", onError);
                    window.removeEventListener("unhandledrejection", onUnhandledRejection);
                    dotNetReference = null;
                },
                getUrl: () => window.location.pathname + window.location.hash,
                getUserAgent: () => navigator.userAgent
            };
        })();
    </script>

    <script src="js/ui-feedback.js?v=2"></script>
    <script src="js/fx.js?v=7"></script>
